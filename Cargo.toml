[package]
publish = false
name = "vr-jcs"
version = "0.1.0"
edition = "2021"
description = "JSON Canonicalization Scheme (RFC 8785) glovebox for deterministic serialization"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
blake3 = "1"

[lints.rust]
unsafe_code = "warn"
unused_extern_crates = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = { level = "deny", priority = 1 }
expect_used = { level = "deny", priority = 1 }
