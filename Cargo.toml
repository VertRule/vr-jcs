[package]
name = "vr-jcs"
version = "0.4.1"
edition = "2021"
license = "Apache-2.0"
description = "RFC 8785 JSON Canonicalization Scheme (JCS) for deterministic serialization in Rust"
repository = "https://github.com/VertRule/vr-jcs"

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order", "unbounded_depth"] }
zmij = "1"
blake3 = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_extern_crates = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
dead_code = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Panic-path prevention
unwrap_used = { level = "deny", priority = 1 }
expect_used = { level = "deny", priority = 1 }
panic = { level = "deny", priority = 1 }
manual_assert = { level = "deny", priority = 1 }
# Incomplete code markers
todo = { level = "deny", priority = 1 }
unimplemented = { level = "deny", priority = 1 }
# Debug / process artifacts
dbg_macro = { level = "deny", priority = 1 }
print_stdout = { level = "deny", priority = 1 }
print_stderr = { level = "deny", priority = 1 }
exit = { level = "deny", priority = 1 }
mem_forget = { level = "deny", priority = 1 }
# Numeric safety
float_arithmetic = { level = "deny", priority = 1 }
lossy_float_literal = { level = "deny", priority = 1 }
cast_precision_loss = { level = "deny", priority = 1 }
suboptimal_flops = { level = "deny", priority = 1 }
# Useful signal, lower severity
indexing_slicing = "warn"
match_wild_err_arm = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
# Pedantic overrides
module_name_repetitions = "allow"
too_many_lines = "allow"
